<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Liaison 界面视觉规范</title>
<!--
  扩展自身界面的视觉规范查看器。

  设计上有一条硬规矩：**这里不硬编码任何令牌值**，
  全部从同目录的 ui-tokens.js 里读 window.__liaisonUITokens 动态渲染。
  所以改了令牌、刷新这一页就是最新的，规范和实现不可能漂移。

  直接双击打开即可（无需服务器，同目录相对引用）。
-->
<script src="./ui-tokens.js"></script>
<style>
  /* 这一页本身也用令牌来画，等于顺手做了一遍自证 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; min-height: 100vh;
    background: #0A1219; color: rgba(255,255,255,.92);
    font: 400 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }

  /* ── 左侧导航 ─────────────────────────────────────────── */
  nav {
    flex: 0 0 200px; position: sticky; top: 0; align-self: flex-start;
    height: 100vh; overflow-y: auto; padding: 24px 12px;
    border-right: 1px solid rgba(255,255,255,.08);
  }
  nav h1 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding: 0 10px; }
  nav .sub { font-size: 11px; color: rgba(255,255,255,.42); padding: 0 10px; margin-bottom: 18px; }
  nav a {
    display: block; padding: 7px 10px; margin-bottom: 2px; border-radius: 6px;
    color: rgba(255,255,255,.62); text-decoration: none; font-size: 12px;
  }
  nav a:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.92); }
  nav a.on { background: rgba(0,119,255,.16); color: #9fcdff; }

  /* ── 右侧内容 ─────────────────────────────────────────── */
  main { flex: 1 1 auto; min-width: 0; padding: 32px 40px 120px; max-width: 1100px; }
  section { margin-bottom: 56px; scroll-margin-top: 24px; }
  section > h2 {
    font-size: 17px; font-weight: 600; margin: 0 0 6px;
    padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  section > .note {
    font-size: 12px; color: rgba(255,255,255,.52); margin: 10px 0 20px;
    line-height: 1.75; max-width: 760px;
  }
  section > .note code {
    font: 400 11px/1.5 ui-monospace, Menlo, monospace;
    background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px;
  }
  .warn {
    border-left: 2px solid #FFB84D; background: rgba(255,184,77,.08);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 0 0 20px;
    font-size: 12px; color: rgba(255,255,255,.72); max-width: 760px;
  }

  /* 通用：令牌行 —— 左边样例、右边名字与值 */
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: flex; align-items: center; gap: 16px; padding: 9px 12px;
    border-radius: 8px;
  }
  .row:hover { background: rgba(255,255,255,.04); }
  .row .demo { flex: 0 0 200px; display: flex; align-items: center; }
  .row .meta { flex: 1 1 auto; min-width: 0; }
  .row .k {
    font: 500 12px/1.5 ui-monospace, Menlo, monospace; color: #9fcdff;
  }
  .row .v {
    font: 400 11px/1.5 ui-monospace, Menlo, monospace;
    color: rgba(255,255,255,.42); word-break: break-all;
  }
  .row .use { font-size: 11px; color: rgba(255,255,255,.52); margin-top: 2px; }

  /* 色卡 */
  .sw {
    width: 52px; height: 34px; border-radius: 6px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.14);
    /* 棋盘底：半透明色必须能看出透明度 */
    background-image:
      linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%),
      linear-gradient(45deg, #333 25%, #222 25%, #222 75%, #333 75%);
    background-size: 12px 12px; background-position: 0 0, 6px 6px;
  }
  .sw i { display: block; width: 100%; height: 100%; border-radius: 5px; }
</style>
</head>
<body>
<nav id="nav">
  <h1>Liaison 界面规范</h1>
  <div class="sub">扩展自身 UI · 非业务组件库</div>
</nav>
<main id="main"></main>
<script src="./ui-kit.js"></script>
</body>
</html>
